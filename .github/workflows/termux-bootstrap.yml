name: Termux Bootstrap & APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Bootstrap Config
        run: |
          echo "Packaging termux bootstrap configuration for com.agentdesk.app"
          mkdir -p app/src/main/assets
          echo "BOOTSTRAP_PKG=com.agentdesk.app" > app/src/main/assets/bootstrap_info.txt

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agentdesk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
